<!-- Favicon. Two carried elements and nothing else: the CMC red #CB141D
     and the "C" of the handwritten wordmark, in the bone ink #EDEAE4.

     The red tile is doing the work at 16px, where no script letterform
     resolves; the C is what makes it legible at 32px and up. The stroke is
     baked because a favicon is never reached by a stylesheet, and it is
     sized for that band — 7 source units reads as ~1px at 32px. -->
